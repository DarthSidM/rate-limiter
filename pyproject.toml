[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "redis-rate-limiter"
version = "0.1.0"
description = "A Redis-backed distributed rate limiter for Python and FastAPI"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "redis[hiredis]>=5.0",
    "fastapi>=0.115",
    "pyyaml>=6.0",
]


[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

dev = [
    "redis-rate-limiter[test]",
    "ruff>=0.8",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
rate_limiter = [
    "algorithms/lua/*.lua",
]